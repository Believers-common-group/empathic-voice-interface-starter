# trigger branch cleanup
name: Security lockfile cleanup

on:
  push:
    branches:
      - security/brace-expansion-2026-08

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9
      - name: Remove unrelated lockfile metadata refreshes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pnpm-lock.yaml')
          s = p.read_text()
          removals = [
              "    deprecated: Potential CWE-502 - Update to 1.3.1 or higher\n",
              "    deprecated: This version is no longer supported. Please see https://eslint.org/version-support for other options.\n",
              "    deprecated: This version has a security vulnerability. Please upgrade to a patched version. See https://nextjs.org/blog/security-update-2025-12-11 for more details.\n",
              "    deprecated: Old versions of tar are not supported, and contain widely publicized security vulnerabilities, which have been fixed in the current version. Please update. Support for old versions may be purchased (at exorbitant rates) by contacting i@izs.me\n",
              "    deprecated: uuid@10 and below is no longer supported.  For ESM codebases, update to uuid@latest.  For CommonJS codebases, use uuid@11 (but be aware this version will likely be deprecated in 2028).\n",
          ]
          for old in removals:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one metadata line: {old!r}, got {s.count(old)}')
              s = s.replace(old, '', 1)
          old_glob = "    deprecated: Old versions of glob are not supported, and contain widely publicized security vulnerabilities, which have been fixed in the current version. Please update. Support for old versions may be purchased (at exorbitant rates) by contacting i@izs.me\n"
          glob7_block = "  glob@7.2.3:\n    resolution: {integrity: sha512-nFR0zLpU2YCaRxwoCJvL6UvCH2JFyFVIvwTLsIf21AuHlMskA1hhTdk+LlYJtOlYt9v6dvszD2BGRqBL+iQK9Q==}\n" + old_glob
          restored_glob7 = "  glob@7.2.3:\n    resolution: {integrity: sha512-nFR0zLpU2YCaRxwoCJvL6UvCH2JFyFVIvwTLsIf21AuHlMskA1hhTdk+LlYJtOlYt9v6dvszD2BGRqBL+iQK9Q==}\n    deprecated: Glob versions prior to v9 are no longer supported\n"
          if s.count(glob7_block) != 1:
              raise SystemExit('glob@7 metadata block not found exactly once')
          s = s.replace(glob7_block, restored_glob7, 1)
          if s.count(old_glob) != 1:
              raise SystemExit(f'expected one remaining glob metadata line, got {s.count(old_glob)}')
          s = s.replace(old_glob, '', 1)
          p.write_text(s)
          PY
      - name: Verify frozen lockfile and patched versions
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          grep -q "brace-expansion@1.1.18:" pnpm-lock.yaml
          grep -q "brace-expansion@2.1.4:" pnpm-lock.yaml
          ! grep -q "brace-expansion@1.1.11:" pnpm-lock.yaml
          ! grep -q "brace-expansion@2.0.1:" pnpm-lock.yaml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore: keep security lockfile diff focused"
          git push
